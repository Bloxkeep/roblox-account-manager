# The interface checks (Tests/ui/run.mjs): the real page with the fake app behind it (ui/dev/mock.js) in a headless Edge,
# clicked through like a person and compared with the saved copies in Tests/ui/baseline. A difference fails the run, and
# what the page showed is kept on the run (Artifacts) to compare. After a change that is meant to look different, save
# the new copies on your PC (node Tests/ui/run.mjs --update) and commit them with the change.
# Run by hand only (Actions › Interface checks › Run workflow): the checks run on the PC before a change is committed,
# and here they took about 20 minutes a push to say the same again (2026-10-23, the owner's call).
name: Interface checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: React parts (ui/)
        working-directory: ui
        run: |
          npm ci
          npx --no-install tsc --noEmit
          node build.mjs
      - name: Interface checks
        run: node Tests/ui/run.mjs
      - name: Keep what the page showed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-actual
          path: Tests/ui/out/actual
          retention-days: 14
