# The interface checks (Tests/ui/run.mjs): the real page with the fake app behind it (dev/mock.js) in a headless Edge,
# clicked through like a person and compared with the saved copies in Tests/ui/baseline. A difference fails the run, and
# what the page showed is kept on the run (Artifacts) to compare. After a change that is meant to look different, save
# the new copies on your PC (node Tests/ui/run.mjs --update) and commit them with the change.
name: Interface checks

on:
  push:
    branches: [main]
    paths: ['RobloxManager/wwwroot/**', 'RobloxManager/whatsnew.json', 'ui/**', 'dev/**', 'Tests/ui/**', '.github/workflows/ui-tests.yml']
  pull_request:
    paths: ['RobloxManager/wwwroot/**', 'RobloxManager/whatsnew.json', 'ui/**', 'dev/**', 'Tests/ui/**', '.github/workflows/ui-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: React parts (ui/)
        working-directory: ui
        run: |
          npm ci
          npx --no-install tsc --noEmit
          node build.mjs
      - name: Interface checks
        run: node Tests/ui/run.mjs
      - name: Keep what the page showed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-actual
          path: Tests/ui/out/actual
          retention-days: 14
