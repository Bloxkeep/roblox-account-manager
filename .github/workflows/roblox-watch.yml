# Checks Roblox for a new Windows build or a changed single-window setting and posts what it found to Discord
# (services/RobloxWatch/watch.py). Started within a minute of a Roblox update by the Cloudflare watcher (services/RobloxWatch/worker),
# and every 10 minutes by itself in case that one is down. What it saw is kept on the roblox-status branch, with the
# install files' download count for the README's badge (downloads.json).
# Secret: DISCORD_WEBHOOK (without it, the messages only go to the run's log).
name: Roblox watch

on:
  workflow_dispatch:
    inputs:
      reason:
        description: What started it (the Cloudflare watcher says what it saw)
        default: manual
      force:
        description: Check the live build again even if it was checked before
        type: boolean
        default: false
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: roblox-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: services/RobloxWatch
      - uses: actions/checkout@v4
        with:
          ref: roblox-status
          path: status
      - name: Check Roblox (${{ inputs.reason || 'schedule' }})
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 services/RobloxWatch/watch.py --status status/multi-status.json ${{ inputs.force && '--force' || '' }}
      # The README's downloads badge (the Discord bot serves it from downloads.json): how many times the install files
      # were downloaded, over every release. Counted here with this run's token: GitHub's API refuses most unsigned calls
      # from the bot's shared Cloudflare addresses. Not the update packages nor releases.win.json, which every installed
      # copy downloads itself when it looks for an update ("2.2k downloads" of some 90 installs, 2026-10-24).
      - name: Count downloads
        if: success() || failure()
        continue-on-error: true
        working-directory: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[].assets[] | select(.name == "Bloxkeep-Setup.exe" or .name == "Bloxkeep-Setup-Offline.exe" or .name == "Bloxkeep-Portable.zip") | .download_count' \
            | awk '{ s += $1 } END { print s + 0 }')
          printf '{"installs":%s}\n' "$n" > downloads.json
      - name: Save what was seen
        if: success() || failure()
        working-directory: status
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Roblox watch: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:roblox-status
