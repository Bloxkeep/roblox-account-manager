# Publishes Bloxkeep's website (https://minhhoang0122.github.io/Bloxkeep/) to GitHub Pages: site/build.mjs turns the
# landing page and the user guide (docs/guide) into HTML. Runs whenever what the site is made of changes on main.
# Pages must be set to "GitHub Actions" (Settings > Pages > Source).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'RobloxManager/whatsnew.json'
      - 'RobloxManager/wwwroot/logo.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
