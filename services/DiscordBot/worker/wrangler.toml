# Built by Cloudflare from this repository, like services/Feedback/worker (Workers & Pages › bloxkeep-bot, root directory
# services/DiscordBot/worker). Its secret DISCORD_TOKEN (the bot's token from the Discord Developer Portal) is set in the worker's
# settings. Keeps Bloxkeep's Discord bot online around the clock: worker.js. How it is doing:
# https://bloxkeep-bot.bloxkeep-app.workers.dev/status
name = "bloxkeep-bot"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Every minute: connected, or connecting again (the object's own alarm usually has already).
[triggers]
crons = ["* * * * *"]

# Public: the application's id and the key its interactions are signed with (Developer Portal › General Information).
[vars]
DISCORD_APP_ID = "1561788269933498408"
DISCORD_PUBLIC_KEY = "fafc7af8a87571963ebe66f46a4941279b2aee309c28d1b7ddc0b88d565c7a08"
# Bloxkeep's community server: /discord (the app's Discord button) sends people to an invite into it that always works.
COMMUNITY_GUILD = "1562230857152856264"

# Which version of this Worker runs: the bot's object, still on an older one after a deploy, starts over on the new one
# (worker.js ensure).
[version_metadata]
binding = "CF_VERSION"

# Beats from Bloxkeep apps (/online/ping): a few dozen a minute from one address at most.
[[ratelimits]]
name = "PING_LIMITER"
namespace_id = "1201"
simple = { limit = 60, period = 60 }

[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "Gateway"

# The free plan only has objects stored in SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gateway"]
