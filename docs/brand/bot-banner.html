<!doctype html>
<!-- The Discord bot's profile banner (Developer Portal › Bot › Banner): docs/brand/bot-banner.png, 1360×480 (Discord's
     680×240 at twice the size). Made from the logo's own shapes and colours (RobloxManager/wwwroot/logo.svg), solid, no
     gradients. Discord puts the bot's picture over the bottom-left corner, so the words sit high and nothing else is
     there. To make it again: open this page at 1360×480 and take a screenshot (see the note at the bottom). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bloxkeep bot banner</title>
<style>
  html, body { margin: 0; }
  body { width: 1360px; height: 480px; overflow: hidden; position: relative; background: #15181e; font-family: 'Segoe UI', system-ui, sans-serif; }
  .words { position: absolute; left: 110px; top: 112px; }
  .name { color: #fff; font-size: 124px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .what { color: #aab2bf; font-size: 40px; font-weight: 400; margin-top: 22px; }
  .what b { color: #f5c933; font-weight: 600; }
  svg { position: absolute; left: 790px; top: -50px; width: 704px; height: 704px; }
</style>
</head>
<body>
  <div class="words">
    <div class="name">Bloxkeep</div>
    <div class="what">Roblox account manager <b>·</b> Multi-Roblox</div>
  </div>
  <!-- The logo's blocks, eleven times larger, cut by the edges. -->
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <g transform="rotate(-8 32 32)">
      <rect x="25" y="10" width="28" height="28" rx="6" fill="#3b4250"/>
      <rect x="12" y="20" width="32" height="32" rx="7" fill="#f5c933"/>
      <rect x="19.5" y="30" width="4.2" height="6.5" rx="2.1" fill="#15181e"/>
      <rect x="32.3" y="30" width="4.2" height="6.5" rx="2.1" fill="#15181e"/>
      <path d="M20.5 41.5c4.6 4.2 10.4 4.2 15 0" fill="none" stroke="#15181e" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </svg>
  <!-- msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1360,480
       --screenshot=docs/brand/bot-banner.png docs/brand/bot-banner.html -->
</body>
</html>
