<!doctype html>
<meta charset="utf-8">
<title>Bloxkeep icons: solid</title>
<!-- A try-out, not the app's set yet (the owner, 2026-11-15, on the line icons: "xấu không đặc biệt lắm"). The logo's own
     idea carried to every icon: a solid block in front, its twin behind it up and to the right, details cut out of the
     front instead of drawn as lines. Shown beside the line set before anything in the app changes. -->
<style>
  :root { --ground: #17181c; --panel: #1f2126; --line: #2c2e35; --text: #f1efe9; --muted: #9a9890; --dim: #5b5d66; --face: #f5c933; }
  body { margin: 0; padding: 28px 32px 40px; background: var(--ground); color: var(--text); font: 13px/1.4 "Lexend", system-ui, sans-serif; }
  h2 { font-size: 15px; font-weight: 600; margin: 30px 0 4px; }
  h2:first-child { margin-top: 0; }
  p { margin: 0 0 14px; color: var(--muted); max-width: 70ch; }
  .sheet { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px 6px; }
  figure { margin: 0; display: grid; justify-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
  .i { width: 44px; height: 44px; color: var(--text); }
  .i svg, .sm svg, .rail svg, .row svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .sm { width: 18px; height: 18px; color: var(--text); }
  .old { position: relative; width: 44px; height: 44px; }
  .old span { position: absolute; inset: 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
  .old .l { background: var(--text); } .old .a { background: var(--face); }
  .use { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
  .rail { width: 64px; padding: 10px 0; background: #121317; border: 1px solid var(--line); border-radius: 14px; display: grid; justify-items: center; gap: 6px; }
  .rail b { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
  .rail b i { width: 25px; height: 25px; display: block; }
  .rail b.on { background: #2a2c33; color: var(--face); }
  .rows { width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; color: var(--text); }
  .row i { width: 20px; height: 20px; flex: none; color: var(--muted); }
  .row.on { background: #2a2c33; } .row.on i { color: var(--face); }
  .cap { color: var(--muted); font-size: 11px; margin-top: 8px; text-align: center; }
</style>
<body>
<script>
// Each icon: its solid parts, then what is cut out of them. `S` marks a stroked part (a solid line, not an outline).
const S = (d, w = 3) => `<path d="${d}" fill="none" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const F = d => `<path d="${d}"/>`;
const R = (x, y, w, h, r) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`;
const C = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}"/>`;
const ICONS = {
  home: [F('M2.6 11.4 12 3.2l9.4 8.2v7.4a2.8 2.8 0 0 1-2.8 2.8H5.400a2.8 2.8 0 0 1-2.8-2.8z'), R(9.4, 13.2, 5.2, 8.6, 1.7)],
  accounts: [R(2.8, 2.8, 18.4, 18.4, 5.2), R(7.3, 8.4, 2.5, 3.9, 1.25) + R(14.2, 8.4, 2.5, 3.9, 1.25) + S('M7.9 15.3c2.5 2.300 5.700 2.300 8.200 0', 1.9)],
  gamepad: [F('M7.400 5.500h9.200A5.900 5.900 0 0 1 22.500 11.400v3.300a3.800 3.800 0 0 1-6.900 2.200l-.5-.700H8.900l-.5.700a3.800 3.800 0 0 1-6.900-2.200v-3.300A5.900 5.900 0 0 1 7.400 5.500z'), S('M7.600 9.300v4.200M5.500 11.400h4.200', 1.9) + C(15.300, 9.900, 1.25) + C(18.100, 12.600, 1.25)],
  windows: [R(2.2, 3.6, 19.6, 13.6, 3.4) + R(10.5, 16.500, 3, 3.500, 0) + R(6.500, 19.300, 11, 2.600, 1.3), R(5.300, 6.700, 6.400, 4.700, 1.4)],
  history: [C(12, 12, 9.8), S('M12 6.700v5.500l3.700 2.200', 2.2)],
  settings: [S('M5.200 3.500v17M12 3.500v17M18.800 3.500v17', 2.3) + R(2.200, 12.400, 6, 6, 1.9) + R(9, 5.400, 6, 6, 1.9) + R(15.800, 10.400, 6, 6, 1.9), ''],
  lock: [R(3.800, 10, 16.400, 11.800, 3.600) + S('M7.700 10V7.600a4.300 4.300 0 0 1 8.600 0V10', 2.6), C(12, 14.800, 1.700) + R(11.100, 15.300, 1.800, 3.700, .9)],
  bell: [F('M12 2.500a6.900 6.900 0 0 0-6.900 6.900v3.600l-2 4.200a1.100 1.100 0 0 0 1 1.600h15.800a1.100 1.100 0 0 0 1-1.600l-2-4.200V9.400A6.900 6.900 0 0 0 12 2.500z') + R(9.300, 19.800, 5.400, 2.500, 1.25), ''],
  shield: [F('M12 2.300l8.300 3.100v6.100c0 5.100-3.400 8.800-8.300 10.300-4.900-1.500-8.300-5.200-8.300-10.300V5.400z'), S('M8.300 11.900l2.700 2.700 4.800-5.100', 2.2)],
  download: [S('M12 3.200v10.200M7.200 9.200l4.800 4.800 4.800-4.800', 3.100) + R(3, 17.400, 18, 4.400, 2.200), ''],
  play: [F('M6.200 4.700v14.600a1.900 1.900 0 0 0 2.900 1.600l11.900-7.300a1.900 1.900 0 0 0 0-3.200L9.100 3.100a1.900 1.900 0 0 0-2.900 1.600z'), ''],
  search: [S('M17.300 10.300a7 7 0 1 1-14 0 7 7 0 0 1 14 0zM15.600 15.600l5.300 5.300', 3.100), ''],
};
let n = 0;
/** One icon: the front (0.84 of the box, bottom left) with its cut-outs, and the twin behind it up and to the right.
 *  twin: false leaves the twin out (small sizes); tilt: the logo's lean, in degrees. */
function draw(name, { twin = true, tilt = 0, front = 'currentColor', back = '#4b4e58' } = {}) {
  const [solid, cut] = ICONS[name], id = `k${n++}`;
  const sc = twin ? .84 : 1, fx = 0, fy = twin ? 3.84 : 0, tx = 3.84, ty = 0;
  return `<svg viewBox="0 0 24 24" fill="none"><g transform="rotate(${tilt} 12 12)">
    <defs>
      <mask id="${id}c" maskUnits="userSpaceOnUse" x="-4" y="-4" width="32" height="32"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><g fill="#000" stroke="#000">${cut}</g></mask>
      <mask id="${id}g" maskUnits="userSpaceOnUse" x="-4" y="-4" width="32" height="32"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/>
        <g transform="translate(${fx} ${fy}) scale(${sc})" fill="#000" stroke="#000"><g stroke-width="3.400" stroke-linejoin="round">${solid}</g></g></mask>
    </defs>
    ${twin ? `<g mask="url(#${id}g)"><g transform="translate(${tx} ${ty}) scale(${sc})" fill="${back}" stroke="${back}">${solid}</g></g>` : ''}
    <g transform="translate(${fx} ${fy}) scale(${sc})"><g mask="url(#${id}c)" fill="${front}" stroke="${front}">${solid}</g></g>
  </g></svg>`;
}
const OLD = { home: 'home', accounts: 'users', gamepad: 'gamepad', windows: 'screens', history: 'clock', settings: 'sliders', lock: 'lock', bell: 'bell', shield: 'shieldCheck', download: 'download', play: 'play', search: 'search' };
const names = Object.keys(ICONS);
const sheet = (title, note, cell) => `<h2>${title}</h2><p>${note}</p><div class="sheet">${names.map(k => `<figure>${cell(k)}<figcaption>${k}</figcaption></figure>`).join('')}</div>`;
// Roblox's own mark stays for the Games tab (the owner, 2026-11-15: "cái games vẫn để roblox nha, đừng có mà đổi"): it is
// theirs, not one of Bloxkeep's icons, so it is drawn as it is in the app.
const ROBLOX = '<svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" transform="rotate(15 12 12)" d="M4.6 4.6h14.8v14.8H4.6z M10 10h4v4h-4z"/></svg>';
const rail = opt => `<div><div class="rail">${['home', 'accounts', 'roblox', 'windows', 'history', 'settings', 'lock'].map((k, i) => `<b class="${i === 1 ? 'on' : ''}"><i>${k === 'roblox' ? ROBLOX : draw(k, opt)}</i></b>`).join('')}</div><div class="cap">Games: Roblox's mark, kept</div></div>`;
const rows = opt => `<div class="rows">${[['play', 'Launching'], ['gamepad', 'Roblox version'], ['history', 'Staying in game'], ['bell', 'Notifications'], ['shield', 'Vault & security'], ['download', 'Bloxkeep']].map(([k, t], i) => `<div class="row ${i === 3 ? 'on' : ''}"><i>${draw(k, opt)}</i>${t}</div>`).join('')}</div>`;
document.body.insertAdjacentHTML('beforeend',
  sheet('Now: lines', 'The set in the app today: a line drawing with one small part in the accent colour.',
    k => `<span class="old"><span class="l" style="-webkit-mask-image:url(../assets/icons/duo/${OLD[k]}.svg);mask-image:url(../assets/icons/duo/${OLD[k]}.svg)"></span><span class="a" style="-webkit-mask-image:url(../assets/icons/duo/${OLD[k]}.a.svg);mask-image:url(../assets/icons/duo/${OLD[k]}.a.svg)"></span></span>`)
  + sheet('A · solid, with its twin', "The logo's two blocks in every icon: a solid shape in front, the same shape behind it up and to the right, details cut out.", k => `<span class="i">${draw(k)}</span>`)
  + sheet('B · the same, leaning like the logo', 'A with the logo\'s lean (8° to the left).', k => `<span class="i">${draw(k, { tilt: -8 })}</span>`)
  + sheet('Small (18 px): the front alone', 'In buttons and menus the twin is left out, as the echo block is today.', k => `<span class="sm">${draw(k, { twin: false })}</span>`)
  + `<h2>In place</h2><p>The rail and a Settings list, in A and in B. The chosen one takes the accent colour.</p><div class="use">${rail({})}${rows({})}${rail({ tilt: -8 })}${rows({ tilt: -8 })}</div>`);
</script>
</body>
