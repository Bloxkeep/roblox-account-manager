<!doctype html>
<!-- Bloxkeep's backdrop, rendered: the keep at dusk in real 3D. You stand on the walk between the keep's two walls;
     they run to the gatehouse on the horizon; the logo's keeper rises behind it; sky lanterns drift up over it all.
     Every wall block, paving slab and lantern is its own rounded block (the logo's shape); the low sun behind the keep
     rims them and throws the battlements' shadows down the walk; lanterns glow and light the stones near them.
     ?w=&h= the picture's size. Rendered headless (render.sh). -->
<html>
<head>
<meta charset="utf-8">
<title>render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => q.has(k) ? +q.get(k) : d;
const W = num('w', 2880), H = num('h', 1800);
let seed = num('seed', 9);
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const rr = (a, b) => a + rnd() * (b - a);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = num('exp', 0.86);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HAZE = new THREE.Color(0x7d4f86);
scene.fog = new THREE.FogExp2(HAZE, num('fog', 0.0042));

// the eye: on the walk, looking along it and a little up, so the horizon lies low and the sky fills the page's top
const camera = new THREE.PerspectiveCamera(num('fov', 57), W / H, 0.3, 4000);
camera.position.set(0.9, 3.25, 15);
camera.lookAt(num('lx', -9), 3.25 + Math.tan(THREE.MathUtils.degToRad(num('pitch', 17))) * 100, -85);

// --- sky: night overhead down through violet and rose to amber at the horizon, warmest behind the keep
const SUN_DIR = new THREE.Vector3(0.0, 0.05, -1).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 48, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sun: { value: SUN_DIR } },
  vertexShader: 'varying vec3 d; void main(){ d = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform vec3 sun; varying vec3 d;
    vec3 c(float r, float g, float b){ return pow(vec3(r, g, b) / 255.0, vec3(2.2)); }
    void main(){
      vec3 v = normalize(d);
      float h = clamp(v.y, 0.0, 1.0);
      vec3 col = mix(c(248., 185., 76.), c(238., 138., 76.), smoothstep(0.0, 0.03, h));
      col = mix(col, c(184., 90., 112.), smoothstep(0.02, 0.07, h));
      col = mix(col, c(109., 76., 134.), smoothstep(0.05, 0.12, h));
      col = mix(col, c(53., 64., 127.), smoothstep(0.10, 0.20, h));
      col = mix(col, c(29., 47., 107.), smoothstep(0.17, 0.30, h));
      col = mix(col, c(19., 32., 74.), smoothstep(0.26, 0.42, h));
      col = mix(col, c(12., 20., 48.), smoothstep(0.38, 0.58, h));
      col = mix(col, c(7., 10., 20.), smoothstep(0.52, 0.85, h));
      float az = max(dot(normalize(v.xz), normalize(sun.xz)), 0.0);
      col *= mix(0.55, 1.25, pow(az, 3.0));
      if (v.y < 0.0) col = c(12., 18., 50.);
      gl_FragColor = vec4(col, 1.0);
    }`,
}));
sky.position.copy(camera.position);
scene.add(sky);

// stars, thicker overhead
{
  const n = 2600, pos = new Float32Array(n * 3), colr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const az = rnd() * Math.PI * 2, el = Math.asin(0.12 + rnd() * 0.86), r = 2800;
    pos.set([Math.cos(el) * Math.sin(az) * r, Math.sin(el) * r, -Math.abs(Math.cos(el) * Math.cos(az)) * r], i * 3);
    const warm = rnd() < 0.12, b = 0.5 + rnd() * 1.4;
    colr.set(warm ? [1.0 * b, 0.82 * b, 0.36 * b] : [0.78 * b, 0.84 * b, 1.0 * b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(colr, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 2.4, sizeAttenuation: false, vertexColors: true, fog: false, depthWrite: false }));
  stars.position.copy(camera.position);
  scene.add(stars);
}

{
  // a band of faint stars slanting across the sky, thickest along its middle
  const n = 7000, pos = new Float32Array(n * 3), colr = new Float32Array(n * 3);
  const axis = new THREE.Vector3(0.55, 0.62, -0.56).normalize(), side = new THREE.Vector3().crossVectors(axis, new THREE.Vector3(0, 1, 0)).normalize(), up = new THREE.Vector3().crossVectors(side, axis).normalize();
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, off = (rnd() + rnd() + rnd() - 1.5) * 0.22;
    const v = new THREE.Vector3().addScaledVector(side, Math.cos(a)).addScaledVector(up, Math.sin(a)).addScaledVector(axis, off).normalize();
    if (v.y < 0.2 || v.z > 0) { i--; if (rnd() < 0.002) break; continue; }
    pos.set([v.x * 2700, v.y * 2700, v.z * 2700], i * 3);
    const b = 0.16 + rnd() * 0.5 * (1 - Math.min(1, Math.abs(off) / 0.33));
    colr.set([0.75 * b, 0.78 * b, 1.0 * b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(colr, 3));
  const way = new THREE.Points(g, new THREE.PointsMaterial({ size: 1.7, sizeAttenuation: false, vertexColors: true, fog: false, depthWrite: false }));
  way.position.copy(camera.position);
  scene.add(way);
  // a few bright ones
  const m = 46, p2 = new Float32Array(m * 3);
  for (let i = 0; i < m; i++) { const az = rnd() * Math.PI * 2, el = Math.asin(0.2 + rnd() * 0.75); p2.set([Math.cos(el) * Math.sin(az) * 2750, Math.sin(el) * 2750, -Math.abs(Math.cos(el) * Math.cos(az)) * 2750], i * 3); }
  const g2 = new THREE.BufferGeometry(); g2.setAttribute('position', new THREE.BufferAttribute(p2, 3));
  const bright = new THREE.Points(g2, new THREE.PointsMaterial({ size: 4.4, sizeAttenuation: false, color: new THREE.Color(1.5, 1.6, 1.9), fog: false, depthWrite: false }));
  bright.position.copy(camera.position);
  scene.add(bright);
  // one shooting star
  const trail = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.7, 2.0), fog: false, depthWrite: false, transparent: true, opacity: 0.85 }));
  trail.scale.set(190, 2.2, 1); trail.position.set(-420, 760, -1500); trail.rotation.z = -0.42;
  scene.add(trail);
}

// --- light: the low sun behind the keep (rims every block, throws the battlements' shadows down the walk), the sky's own
const sunLight = new THREE.DirectionalLight(0xff8a5a, num('sun', 1.7));
sunLight.position.set(24, 30, -330);
sunLight.target.position.set(0, 0, -70);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(4096, 4096);
const sc = sunLight.shadow.camera; sc.left = -70; sc.right = 70; sc.top = 150; sc.bottom = -150; sc.near = 20; sc.far = 520;
sunLight.shadow.bias = -0.0006; sunLight.shadow.normalBias = 0.05;
scene.add(sunLight, sunLight.target);
scene.add(new THREE.HemisphereLight(0x5f6fe0, 0x0c1238, num('amb', 1.2)));

// --- blocks: everything is rounded boxes, drawn in batches (one per material) with a colour each
const box = new RoundedBoxGeometry(1, 1, 1, 3, 0.09);
const batches = new Map();
const m4 = new THREE.Matrix4(), quat = new THREE.Quaternion(), eul = new THREE.Euler(), v3a = new THREE.Vector3(), v3b = new THREE.Vector3(), tint = new THREE.Color();
const batch = (key, mat, shadow = true) => { if (!batches.has(key)) batches.set(key, { mat, shadow, items: [] }); return batches.get(key).items; };
const STONE = new THREE.MeshStandardMaterial({ roughness: 0.86, metalness: 0.0 });
const GLOW = new THREE.MeshBasicMaterial({ fog: true });
const put = (items, x, y, z, w, h, d, hex, vary = 0, ry = 0, rz = 0) => {
  tint.set(hex);
  if (vary) { const k = 1 + (rnd() - 0.5) * vary; tint.multiplyScalar(k); }
  items.push({ x, y: y + h / 2, z, w, h, d, c: tint.clone(), ry, rz });
};
const stone = (...a) => put(batch('stone', STONE), ...a);
const glow = (x, y, z, w, h, d, hex, power) => { tint.set(hex).multiplyScalar(power); batch('glow', GLOW, false).push({ x, y: y + h / 2, z, w, h, d, c: tint.clone(), ry: 0, rz: 0 }); };

// the walk: paving slabs, six across, a little uneven in tone and height
const ROAD = 0x2a3690, WALL = 0x25309a, WALL_DARK = 0x1c2578;
for (let z = 16; z > -146; z -= 1.5) for (let i = 0; i < 6; i++) stone(-3.75 + i * 1.5 + ((Math.round(z / 1.5) % 2) ? 0.0 : 0.0), -0.2 + rr(0, 0.035), z, 1.44, 0.2, 1.44, ROAD, 0.16);
// curbs
for (let z = 16; z > -146; z -= 3) for (const sx of [-1, 1]) stone(sx * 4.72, -0.05, z, 0.42, 0.3, 2.9, 0x2e3888, 0.1);

// the two walls: two courses of long blocks, staggered; battlements on top; a lantern on every third, a pennant under the others
const lanternAt = [];
for (const sx of [-1, 1]) {
  const wx = sx * 5.7;
  for (let course = 0; course < 2; course++) for (let z = 17 - course; z > -146; z -= 2) stone(wx, course * 1.0, z, 1.5, 0.98, 1.96, course ? WALL : WALL_DARK, 0.14);
  for (let z = 17; z > -146; z -= 2) stone(wx, 1.94, z, 1.72, 0.12, 1.98, 0x3642a8, 0.1);
  let k = 0;
  for (let z = 15; z > -146; z -= 2.4, k++) {
    stone(wx, 2.04, z, 1.5, 0.95, 1.2, WALL, 0.12);
    stone(wx, 2.98, z, 1.62, 0.1, 1.32, 0x3642a8, 0.08);
    if (k % 3 === 1) {
      stone(wx, 3.06, z, 0.4, 0.14, 0.4, 0x0c1030);
      stone(wx, 3.06, z, 0.14, 0.9, 0.14, 0x0c1030);
      glow(wx, 3.9, z, 0.46, 0.56, 0.46, 0xffb347, 2.0);
      stone(wx, 4.46, z, 0.56, 0.12, 0.56, 0x0c1030);
      lanternAt.push([wx, 4.1, z]);
    } else if (k % 3 === 0) {
      // a pennant in the keeper's yellow on the wall's inner face
      put(batch('cloth', new THREE.MeshStandardMaterial({ roughness: 0.9 })), wx - sx * 0.78, 0.5, z, 0.05, 1.3, 0.8, 0xf5c933, 0.06);
      stone(wx - sx * 0.8, 1.8, z, 0.1, 0.1, 1.0, 0x0c1030);
      put(batch('cloth', null), wx - sx * 0.81, 1.45, z, 0.05, 0.16, 0.8, 0xc79f1f);
    }
  }
}
// things left on the walk: crates and barrels by the walls
for (let z = 9; z > -140; z -= rr(7, 15)) {
  const sx = rnd() < 0.5 ? -1 : 1, x = sx * rr(3.5, 4.0);
  if (rnd() < 0.55) {
    stone(x, 0, z, 0.9, 0.9, 0.9, 0x6b4a34, 0.15, rr(-0.3, 0.3));
    if (rnd() < 0.6) stone(x + rr(-0.1, 0.1), 0.9, z + rr(-0.1, 0.1), 0.72, 0.72, 0.72, 0x7a563c, 0.15, rr(-0.5, 0.5));
    if (rnd() < 0.5) stone(x - sx * 0.2, 0, z - 1.0, 0.7, 0.7, 0.7, 0x5e412e, 0.15, rr(-0.4, 0.4));
  } else {
    stone(x, 0, z, 0.72, 1.0, 0.72, 0x70503a, 0.12);
    stone(x, 0.3, z, 0.76, 0.08, 0.76, 0x2a2f55); stone(x, 0.72, z, 0.76, 0.08, 0.76, 0x2a2f55);
    if (rnd() < 0.5) stone(x - sx * 0.1, 0, z + 0.9, 0.72, 1.0, 0.72, 0x66482f, 0.12);
  }
}

// the nearest lanterns light the stones round them
lanternAt.sort((a, b) => b[2] - a[2]).slice(0, 10).forEach(([x, y, z]) => { const p = new THREE.PointLight(0xffa64d, num('lamp', 9), 14, 1.9); p.position.set(x * 0.9, y, z); scene.add(p); });

// the ground outside the walls, the town on it: houses with a lit window, block trees
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x10163c, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.3; ground.receiveShadow = true; scene.add(ground);
const HOUSE = [0x343e96, 0x3b3fa0, 0x2e3688, 0x41399a], ROOFS = [0x5a44a8, 0x6a4a9e, 0x4050b0], LEAF = [0x26397c, 0x2d458c, 0x353a8a];
for (let i = 0; i < 190; i++) { const sx = rnd() < 0.5 ? -1 : 1, x = sx * rr(9, 200), z = rr(6, -330); stone(x, -0.3, z, 0.12, 2.3, 0.12, 0x0c1030); glow(x, 2.0, z, 0.34, 0.4, 0.34, 0xffb347, 1.6); }
for (let i = 0; i < 420; i++) {
  const sx = rnd() < 0.5 ? -1 : 1, x = sx * rr(9, 190), z = rr(8, -330);
  if (rnd() < 0.55) {
    const w = rr(2.6, 4.6), d = rr(2.6, 4.2), h = rr(2.2, 3.6), ry = rr(-0.3, 0.3);
    stone(x, -0.3, z, w, h, d, HOUSE[(rnd() * 4) | 0], 0.12, ry);
    stone(x, -0.3 + h, z, w * 1.08, 0.5, d * 1.08, ROOFS[(rnd() * 3) | 0], 0.1, ry);
    stone(x, -0.3 + h + 0.5, z, w * 0.66, 0.5, d * 0.7, ROOFS[(rnd() * 3) | 0], 0.1, ry);
    if (rnd() < 0.8) glow(x - sx * (w / 2 + 0.03) * Math.cos(ry), -0.3 + h * 0.5, z + rr(-0.6, 0.6), 0.1, 0.8, 0.6, 0xffb347, 1.7);
    if (rnd() < 0.5) glow(x + rr(-0.8, 0.8), -0.3 + h * 0.5, z + (d / 2 + 0.03), 0.6, 0.8, 0.1, 0xffb347, 1.7);
  } else {
    const s = rr(0.8, 1.5);
    stone(x, -0.3, z, 0.4 * s, 2.2 * s, 0.4 * s, 0x1a1c44);
    stone(x, -0.3 + 2.0 * s, z, 2.3 * s, 1.8 * s, 2.3 * s, LEAF[(rnd() * 3) | 0], 0.16);
    stone(x, -0.3 + 3.7 * s, z, 1.4 * s, 1.0 * s, 1.4 * s, LEAF[(rnd() * 3) | 0], 0.16);
  }
}

// the keep the walk leads to: a gatehouse, two towers, battlements, lit windows, flags
const KZ = -150, KS = 0x2a348f;
stone(0, -0.3, KZ, 22, 9.5, 7, KS); // hall
  for (let i = 0; i < 3; i++) stone(0, -0.3 + 9.5 + i * 0.0, KZ, 22.6, 0.5, 7.6, 0x354099);
for (let i = -5; i <= 5; i++) if (i % 2 === 0) stone(i * 2.0, 9.6, KZ + 3.1, 1.6, 1.3, 1.0, KS, 0.08);
glow(0, -0.3, KZ + 3.52, 4.4, 5.8, 0.12, 0xffb347, 2.0); // the gate
stone(0, 5.4, KZ + 3.55, 5.4, 0.6, 0.3, 0x12163a);
for (const wx of [-7.5, -4.8, 4.8, 7.5]) glow(wx, 6.2, KZ + 3.52, 0.9, 1.5, 0.1, 0xffb347, 1.8);
for (const sx of [-1, 1]) {
  stone(sx * 14, -0.3, KZ, 6.4, 13.5, 6.4, 0x2d3794);
  for (const [dx, dz] of [[-1, 1], [1, 1], [0, 1], [-1, -1], [1, -1]]) stone(sx * 14 + dx * 2.5, 13.2, KZ + dz * 2.5, 1.4, 1.4, 1.4, 0x2d3794, 0.06);
  for (const y of [3.4, 7.2, 10.4]) glow(sx * 14, y, KZ + 3.24, 0.9, 1.5, 0.1, 0xffb347, 1.9);
  stone(sx * 14, 14.5, KZ, 0.18, 4.2, 0.18, 0x0c1030);
  put(batch('cloth', null), sx * 14 + 1.3, 17.0, KZ, 2.5, 1.5, 0.06, 0xf5c933);
  }

// far off: stepped block peaks, the haze taking them
for (let i = 0; i < 44; i++) {
  const far = i % 2, x = rr(-760, 760), z = far ? rr(-720, -880) : rr(-430, -560);
  const w = rr(70, 150), front = Math.abs(x) < 90, h = front ? rr(3, 6) : (Math.abs(x) < 130 ? rr(10, 22) : rr(26, 80)) * (far ? 1.5 : 1), lean = rr(-0.25, 0.25);
  const body = far ? 0x4a3f8a : 0x3a3277, cap = far ? 0x8f6fb0 : 0x4a3f8a;
  for (let t = 0; t < 4; t++) stone(x + lean * t * w * 0.2, (h / 4) * t - 0.3, z, w * (1 - t * 0.22), h / 4 + 0.6, w * (1 - t * 0.22) * 0.8, t === 3 ? cap : body, 0.06);
}

// clouds: clusters of soft blocks over a flat base the dusk lights; low ones catch it, high ones nearly vanish in the night
const puff = new RoundedBoxGeometry(1, 1, 1, 5, 0.42);
const cloudBits = () => { if (!batches.has('cloud')) batches.set('cloud', { mat: GLOW, shadow: false, items: [], geo: puff }); return batches.get('cloud').items; };
const cloud = (x, y, z, w, sc, body, lit, pw) => {
  const n = 5 + ((rnd() * 4) | 0);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1) - 0.5, bw = w * rr(0.28, 0.46), bh = sc * rr(9, 16) * (1 - Math.abs(t) * 0.9);
    tint.set(body).multiplyScalar(pw * rr(0.9, 1.1));
    cloudBits().push({ x: x + t * w * 0.8, y: y + bh / 2 + rr(-1.5, 1.5) * sc, z: z + rr(-6, 6), w: bw, h: bh, d: 26 * sc, c: tint.clone(), ry: 0, rz: 0 });
  }
  tint.set(lit).multiplyScalar(pw * 1.35);
  cloudBits().push({ x, y: y - 1.2 * sc, z: z + 2, w: w * 0.92, h: 3.2 * sc, d: 24 * sc, c: tint.clone(), ry: 0, rz: 0 });
};
for (let i = 0; i < 16; i++) {
  const z = rr(-750, -1500), x = rr(-1300, 1300), low = i < 11, y = low ? rr(40, 190) : rr(260, 520);
  cloud(x, y, z, rr(150, 340), rr(1.0, 1.8), low ? 0x40407f : 0x162050, low ? (rnd() < 0.5 ? 0xb85a70 : 0xd9774f) : 0x24306e, low ? 0.4 : 0.22);
}

// sky lanterns let go from the keep, all through the air between here and the horizon
for (let i = 0; i < 230; i++) {
  const z = rr(4, -520), spread = 26 + Math.abs(z) * 0.36, x = rr(-spread, spread), y = rr(5.5, 16 + Math.abs(z) * 0.2), s = rr(0.42, 0.7);
  if (Math.abs(x) < 4.6 && z > -40 && y < 7) continue;
  if (z < -24 && Math.abs(x) < 0.08 * Math.abs(z) && y < 0.15 * Math.abs(z)) continue;
  glow(x, y, z, s, s * 1.25, s, 0xffb04a, rr(1.3, 2.1));
  stone(x, y + s * 1.25, z, s * 1.04, s * 0.16, s * 1.04, 0xb8642a);
}

// --- the logo, rising behind the keep: the slate block, then the keeper, in their own colours (unlit, as the logo is)
const faceTex = () => {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.setTransform(32, 0, 0, 32, -12 * 32, -20 * 32);
  g.fillStyle = g.strokeStyle = '#15181e'; g.lineCap = 'round';
  const p = new Path2D(); p.roundRect(19.5, 30, 4.2, 6.5, 2.1); p.roundRect(32.3, 30, 4.2, 6.5, 2.1); g.fill(p);
  g.lineWidth = 2.6; g.stroke(new Path2D('M20.5 41.5c4.6 4.2 10.4 4.2 15 0'));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
};
const logo = new THREE.Group();
const big = new RoundedBoxGeometry(1, 1, 1, 8, 0.2);
const KEEPER = num('ks', 74);
const slate = new THREE.Mesh(big, new THREE.MeshBasicMaterial({ color: 0x3b4250, fog: false }));
slate.scale.set(KEEPER * 0.875, KEEPER * 0.875, 8); slate.position.set(KEEPER * 0.42, KEEPER * 0.30, -30);
const keeper = new THREE.Mesh(big, new THREE.MeshBasicMaterial({ color: new THREE.Color(0xf5c933).multiplyScalar(num('ky2', 0.8)), fog: false }));
keeper.scale.set(KEEPER, KEEPER, 8);
const face = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: faceTex(), transparent: true, fog: false, depthWrite: false }));
face.scale.set(KEEPER, KEEPER, 1); face.position.z = 4.2;
logo.add(slate, keeper, face);
logo.rotation.z = THREE.MathUtils.degToRad(8);
logo.position.set(num('kx', 1), num('ky', 46), -640);
scene.add(logo);

// --- build the batches
for (const [key, { mat, shadow, items, geo }] of batches) {
  const material = mat || batches.get('cloth').mat || new THREE.MeshStandardMaterial({ roughness: 0.9 });
  const mesh = new THREE.InstancedMesh(geo || box, material, items.length);
  items.forEach((it, i) => {
    quat.setFromEuler(eul.set(0, it.ry, it.rz));
    m4.compose(v3a.set(it.x, it.y, it.z), quat, v3b.set(it.w, it.h, it.d));
    mesh.setMatrixAt(i, m4); mesh.setColorAt(i, it.c);
  });
  mesh.castShadow = shadow; mesh.receiveShadow = shadow;
  scene.add(mesh);
}

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), num('bloom', 0.24), 0.6, 0.92));
composer.addPass(new OutputPass());
composer.render();
composer.render();
document.title = 'done';
</script>
</body>
</html>
