[package]
name = "bloxkeep-ui"
version = "1.1.0"
edition = "2024"
publish = false
description = "Bloxkeep's window, drawn with GPUI; the C# app (RobloxManager) runs it and talks to it over named pipes."

[dependencies]
gpui-kit = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
ureq = "2"
# Windows' proxy and trusted certificates for every HTTP call (src/net.rs), as the C# app's HttpClient had them.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
base64 = "0.22"
percent-encoding = "2"
# The Wiki tab reads a wiki page's HTML (pages/wiki.rs): the same parser GPUI's text view uses.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# The logo drawn at its exact pixels (crisp.rs); the version GPUI already brings.
resvg = { version = "=0.46.0", default-features = false }
raw-window-handle = "0.6"
# The core (src/core/): the C# app moved to Rust. Compiled only with the `core` feature until it is joined to the window.
uuid = { version = "1", features = ["v4", "serde"], optional = true }
regex = "1"
url = "2"
indexmap = { version = "2", features = ["serde"], optional = true }
rand = { version = "0.8", optional = true }
num-bigint = { version = "0.4", optional = true }
sha1_smol = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
aes-gcm = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", optional = true }
zeroize = { version = "1", optional = true }
getrandom = { version = "0.3", optional = true }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
velopack = { version = "0.0", optional = true }
tiny-skia = { version = "0.11", optional = true }
fontdue = { version = "0.9", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
unicode-normalization = { version = "0.1", optional = true }
unicode-segmentation = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Time", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_GdiPlus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_RestartManager", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_UI_Input", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Environment", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_System_Kernel", "Win32_System_Console", "Win32_System_Power", "Win32_System_WindowsProgramming", "Win32_Globalization"] }
webview2-com = { version = "0.38", optional = true }
windows = { version = "0.61", optional = true, features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Media_MediaFoundation"] }
gpui-pre = { version = "=0.3.11", optional = true, features = ["test-support"] }
gpui-pre-windows = { version = "=0.3.11", optional = true, features = ["test-support"] }

[features]
# The Rust core (src/core/), being joined in: `cargo check --features core`.
core = ["dep:uuid", "dep:indexmap", "dep:rand", "dep:num-bigint", "dep:sha1_smol", "dep:sha2", "dep:aes-gcm", "dep:pbkdf2", "dep:zeroize", "dep:getrandom", "dep:tungstenite", "dep:velopack", "dep:tiny-skia", "dep:fontdue", "dep:zip", "dep:unicode-normalization", "dep:unicode-segmentation", "dep:webview2-com", "dep:windows", "serde_json/preserve_order", "image/jpeg", "image/gif", "image/bmp", "image/webp"]
# GPUI draws the hidden window into a picture (its test support): --shot, for checking screens without showing a window.
shot = ["dep:gpui-pre", "dep:gpui-pre-windows", "dep:windows"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
embed-resource = "=3.0.12"

# GPUI with one fix (vendor/gpui-pre/src/window.rs, snapped_content_mask): an empty clip stays empty instead of a
# 1-pixel row at 150 %, which leaked a line of every picture outside a scroll area (palette, status bar; 2026-11-15).
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
