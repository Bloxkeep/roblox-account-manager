<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121316">
  <title>Game Monitor · Bloxkeep</title>
  <link rel="icon" href="/bloxkeep.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/monitor.css">
  <script type="module" src="/monitor.js"></script>
</head>
<body>
  <main>
    <header class="top">
      <div class="brand">
        <img src="/bloxkeep.svg" alt="" width="34" height="34">
        <div>
          <strong>Bloxkeep</strong>
          <span data-i18n="title">Game Monitor</span>
        </div>
      </div>
      <div class="top-tools">
        <span class="link-state" id="session-state">Local network</span>
        <div class="segment" id="language" role="group" aria-label="Language">
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="vi" lang="vi">VI</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <section class="hero" aria-labelledby="active-source">
        <div class="screen" id="screen">
          <div id="placeholder" class="placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <p id="message">Choose a Roblox window or try the sample feed.</p>
          </div>
          <img id="frame" alt="Image from the selected window" hidden>
          <video id="video" aria-label="Live Roblox video" autoplay muted playsinline hidden></video>
          <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span>
          <span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
          <button id="sharp" type="button" class="chip" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
            <span>Sharper</span>
          </button>
          <div class="caption">
            <h1 id="active-source">No window selected</h1>
            <span class="signal" id="signal" aria-live="polite"><i></i><span>Waiting</span></span>
          </div>
        </div>

        <nav class="actions" aria-label="Controls">
          <button id="pause" type="button" class="action" disabled>
            <span class="action-icon">
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5.5" width="3.5" height="13" rx="1"/><rect x="14" y="5.5" width="3.5" height="13" rx="1"/></svg>
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
              <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>
            </span>
            <span class="action-label" id="pause-label">Pause</span>
          </button>
          <button id="fullscreen" type="button" class="action" disabled>
            <span class="action-icon"><svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg></span>
            <span class="action-label" data-i18n="fullscreen">Full screen</span>
          </button>
          <button id="refresh" type="button" class="action">
            <span class="action-icon"><svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>
            <span class="action-label" data-i18n="refresh">Refresh</span>
          </button>
          <button id="sample" type="button" class="action" aria-pressed="false">
            <span class="action-icon"><svg class="line" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" class="fill"/></svg></span>
            <span class="action-label" data-i18n="demo">Sample feed</span>
          </button>
        </nav>
      </section>

      <section class="windows" aria-labelledby="source-heading">
        <div class="windows-head">
          <h2 id="source-heading" data-i18n="sources">Roblox windows</h2>
          <span class="count" id="window-status" aria-live="polite">Finding Roblox windows…</span>
        </div>
        <p id="window-note" class="note" hidden></p>
        <div class="tiles" id="windows"></div>
      </section>
    </div>
  </main>
</body>
</html>
