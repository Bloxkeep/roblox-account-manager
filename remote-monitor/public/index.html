<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Game Monitor · Bloxkeep</title>
  <link rel="icon" href="/bloxkeep.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/monitor.css">
  <script type="module" src="/monitor.js"></script>
</head>
<body>
  <main>
    <header class="mast">
      <div class="brand"><img src="/bloxkeep.svg" alt="" width="42" height="42"><span>Bloxkeep</span></div>
      <div class="mast-tools">
        <span class="status" id="session-state">Local network</span>
        <select id="language" aria-label="Language">
          <option value="en" lang="en" selected>English</option>
          <option value="vi" lang="vi">Tiếng Việt</option>
        </select>
      </div>
    </header>
    <h1 data-i18n="title">Game Monitor</h1>
    <div class="layout">
      <section class="viewer" aria-labelledby="active-source">
        <div class="viewer-bar">
          <h2 id="active-source">No window selected</h2>
          <span class="signal" id="signal" aria-live="polite"><i></i><span>Waiting</span></span>
        </div>
        <div class="screen">
          <div id="placeholder" class="placeholder">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 21h8m-4-4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <p id="message">Choose a Roblox window or try the sample feed.</p>
          </div>
          <img id="frame" alt="Image from the selected window" hidden>
          <video id="video" aria-label="Live Roblox video" autoplay muted playsinline controls hidden></video>
        </div>
      </section>
      <aside class="sources" aria-labelledby="source-heading">
        <div class="source-heading">
          <h2 id="source-heading" data-i18n="sources">Roblox windows</h2>
          <button id="refresh" type="button" class="quiet" data-i18n="refresh">Refresh</button>
        </div>
        <p id="window-status" class="secondary" aria-live="polite">Finding Roblox windows…</p>
        <p id="window-note" class="secondary window-note" hidden></p>
        <div class="window-list" id="windows"></div>
        <button id="sample" type="button" class="source-button" aria-pressed="false">
          <span><strong data-i18n="demo">Sample feed</strong><small data-i18n="demoHelp">Test your connection</small></span><span aria-hidden="true">▶</span>
        </button>
        <button id="pause" type="button" class="quiet pause" disabled>Pause</button>
      </aside>
    </div>
  </main>
</body>
</html>
