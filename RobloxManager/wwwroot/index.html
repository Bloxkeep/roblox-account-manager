<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The page may only load its own files and Roblox CDN images, and may not open any connection itself:
     every request to Roblox goes through the app. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://*.rbxcdn.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Bloxkeep</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"><div class="splash"><img src="logo.svg" alt=""></div></div>
<div id="layer"></div>
<div id="toasts"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
